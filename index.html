<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1f2e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Ccircle cx=%2724%27 cy=%2724%27 r=%2722.5%27 fill=%27%23f1ebdc%27 stroke=%27%23c9a24b%27 stroke-width=%271.5%27/%3E%3Cpolygon points=%2724,9 28,24 20,24%27 fill=%27%23c9a24b%27/%3E%3Cpolygon points=%2724,39 28,24 20,24%27 fill=%27%231c6a8c%27/%3E%3Ccircle cx=%2724%27 cy=%2724%27 r=%272.6%27 fill=%27%230f2d3f%27/%3E%3C/svg%3E" />
    <title>Carta de Rota</title>
    <meta name="description" content="Planejador de estudos com previsão de conclusão por dia da semana." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rota" />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("carta-de-rota:v3") || "{}").theme || "system";
        var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var fx = localStorage.getItem("carta-de-rota:efeitos");
        document.documentElement.dataset.effects =
          fx === "off" || (fx === null && matchMedia("(prefers-reduced-motion: reduce)").matches) ? "off" : "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
